apiVersion: batch/v1
kind: Job
metadata:
  name: data-transform-job
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: transform
        image: python:3.9
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        command: ["python", "-c"]
        args:
          - |
            import random
            if random.random() < 0.3:
              print("ERROR: Validation failed!")
              exit(1)
            print("Transformation completed!")
